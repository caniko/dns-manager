[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"

[prebuild.system_runners]
"x86_64-linux" = "ubuntu-24.04"

[ci]
runtime = "nix"
runner = "codefloe-global"
with_docs = true
step_runners = { cargo-clippy = "codeberg-small", cargo-doc = "codeberg-small", cargo-fmt = "codeberg-tiny", cargo-package = "codeberg-medium", cargo-test = "codeberg-medium", nix-check = "atlas-nix-trusted", quality-tools = "codeberg-small" }
platform = "forgejo"
publish_crates = true
provider = "crow"

[ci.pages]
repo = "caniko/dns-manager"
canonical_domain = "dns-manager.tartanoglu.com"

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "dns-manager"
token_secret = "ATTIC_TOKEN"
