[workspace]
resolver = "2"
members = ["crates/dns-manager"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/caniko/dns-manager"
authors = ["caniko"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
sha2 = "0.11"
pklx = { version = "0.2.0", default-features = false }
tokio = { version = "1", features = ["rt"] }

[workspace.metadata.crane]
name = "dns-manager"

[profile.release]
lto = true
strip = true
