name: Publish Pages

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: atlas-nix-trusted
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        substituters = https://attic.candee.baby/canix https://cache.nixos.org
        trusted-public-keys = canix:uqr0nD3I0mfj9BYfZgTZHMaDKfI2yCTtSA5JGTWKUeg= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build site
        run: nix build .#site

      - name: Verify custom domain
        run: grep -qx 'dns-manager.tartanoglu.com' result/.domains

      - name: Validate Pages domain
        run: |
          nix build .#site --no-link --out-link result-pages-site
          test -f result-pages-site/.domains
          grep -qx dns-manager.tartanoglu.com result-pages-site/.domains
      - name: Deploy Codeberg Pages
        run: nix run .#deploy-pages
