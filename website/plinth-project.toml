[[pages.sections]]
type = "feature_grid"
id = "overview"

[[pages.sections.features]]
title = "Four render targets, one declaration"
description = "The same declared domains produce BIND zonefiles, generic octoDNS configuration, Cloudflare-flavoured octoDNS configuration, and Caddy routes, so a provider is a render target rather than a second source of truth."

[[pages.sections.features]]
title = "Computed names stay correct"
description = "A module can set a domain from hostName and domain, and every rendered record follows that expression instead of a copied string, which is the case where hand-written zones drift."

[[pages.sections.features]]
title = "Resolution in the binary"
description = "Domain matching, sub-to-base inheritance, multi-host merging and validation all live in the standalone Rust CLI, so the same logic is exercised and tested outside Nix."

[[pages.sections.features]]
title = "Cloudflare cache purge"
description = "cloudflare-purge clears 1 to 30 absolute URLs from one zone's edge cache and reads the API token from a file, so the secret never appears in process arguments."

[[pages.sections]]
type = "install"
id = "install"
heading = "Install"
intro = "Start from the flake template, then declare domains through the networking.domains module or a standalone extraConfig attrset. The Nix layer only collects declarations; the binary resolves and renders them."
guide_href = "/docs/"

[[pages.sections.primary_routes]]
label = "Flake template"
audience = "A new flake that renders one zone"
command = "nix flake init -t git+https://github.com/caniko/dns-manager"
href = "/docs/usage.html"
recommended = true

[[pages.sections.secondary_routes]]
label = "Add as a flake input"
audience = "An existing infrastructure flake"
command = 'dns-manager.url = "git+https://github.com/caniko/dns-manager";'
href = "/docs/cli.html"
